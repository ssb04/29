<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Senin İçin ❤️</title>
    <!-- Şık bir yazı tipi için Google Fonts eklentisi -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        /* Romantik koyu kırmızı/bordo bir arka plan geçişi */
        background: linear-gradient(135deg, #1a0b12, #4a0e1c);
        font-family: "Playfair Display", serif;
        color: #ffffff;
        overflow: hidden;
      }

      .container {
        text-align: center;
        padding: 20px;
        max-width: 800px;
      }

      /* Yuvarlak resim çerçevesi ayarları */
      .image-wrapper {
        width: 280px;
        height: 280px;
        margin: 0 auto 40px auto;
        border-radius: 50%;
        padding: 5px;
        background: linear-gradient(45deg, #ff3366, #ff9933);
        /* Başlangıçta görünmez ve bulanık */
        opacity: 0;
        filter: blur(20px);
        transform: scale(0.9);
        /* Animasyon çağrısı */
        animation: fadeInBlur 2.5s ease-out forwards;
        box-shadow: 0 0 30px rgba(255, 51, 102, 0.4);
      }

      .image-wrapper img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #2a0812;
      }

      /* Resmin silinikten görünüre çıkma animasyonu */
      @keyframes fadeInBlur {
        0% {
          opacity: 0;
          filter: blur(20px);
          transform: scale(0.85);
        }
        100% {
          opacity: 1;
          filter: blur(0);
          transform: scale(1);
        }
      }

      /* Daktilo yazısı ayarları */
      .text-container {
        font-size: 28px;
        line-height: 1.6;
        min-height: 90px;
        letter-spacing: 1px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
      }

      /* Daktilo imleci */
      .cursor {
        display: inline-block;
        width: 3px;
        background-color: #ff3366;
        margin-left: 4px;
        animation: blink 0.8s step-end infinite;
        opacity: 0; /* Başlangıçta gizli */
      }

      .cursor.active {
        opacity: 1;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* Telefondan girilirse boyutları küçültme */
      @media (max-width: 600px) {
        .image-wrapper {
          width: 220px;
          height: 220px;
        }
        .text-container {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- RESİM BURAYA GELECEK -->
      <div class="image-wrapper">
        <!-- src kısmına fotoğrafınızın yolunu yazmalısın. Örn: ikimiz.jpg -->
        <img src="img.jpeg" alt="İkimiz" />
      </div>

      <!-- YAZI BURAYA GELECEK -->
      <div class="text-container">
        <span id="typewriter-text"></span><span class="cursor">|</span>
      </div>
    </div>

    <script>
      // Yazılacak metin
      const text =
        "Egemenlik kayıtsız şartsız milletindir ama bu kalp tamamen senindir ❤️\n SENİ SEVİYORUM AY PARÇAM ";
      const textElement = document.getElementById("typewriter-text");
      const cursor = document.querySelector(".cursor");
      let charIndex = 0;

      // Resim animasyonu yaklaşık 2.5 saniye sürüyor.
      // 2.8 saniye sonra yazma işlemini başlatıyoruz.
      setTimeout(() => {
        cursor.classList.add("active");
        typeWriter();
      }, 2800);

      function typeWriter() {
        if (charIndex < text.length) {
          textElement.innerHTML += text.charAt(charIndex);
          charIndex++;

          // Daktilo hissini artırmak için rastgele yazma hızı (50ms ile 120ms arası)
          let typingSpeed = Math.floor(Math.random() * 70) + 50;
          setTimeout(typeWriter, typingSpeed);
        }
      }
    </script>
  </body>
</html>
